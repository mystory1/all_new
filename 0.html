<!DOCTYPE html>
<html lang="sk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Menu</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:#000;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.container{width:100%;max-width:700px;text-align:center}.userinfo{margin-bottom:16px;padding:14px 16px;border:1px solid #333;border-radius:12px;background:#111;color:#e5e7eb;font-size:14px;line-height:1.45}
.buttons{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.nav-btn{display:flex;align-items:center;justify-content:center;min-height:64px;text-decoration:none;color:#fff;background:#1a1a1a;border:1px solid #333;border-radius:12px;font-size:1.1rem;font-weight:600}
.nav-btn:hover{background:#2a2a2a}.logout{margin-top:18px;min-height:52px;padding:0 18px;color:#fff;background:#ef4444;border:1px solid #b91c1c;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer}
.empty{margin-top:18px;padding:16px;border:1px solid #333;border-radius:12px;background:#111;color:#cbd5e1}
@media(max-width:800px){.buttons{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.buttons{grid-template-columns:1fr}.nav-btn{min-height:58px}}
</style></head><body><main class="container"><div class="userinfo" id="userInfo"></div><div id="menu"></div><button class="logout" id="logoutBtn" type="button">Odhlásiť sa</button></main>
<script>
(function(){
 let session=null;try{session=JSON.parse(localStorage.getItem("session_user")||"null")}catch(e){}
 if(!session||!session.approved){location.replace("./index.html");return}
 document.getElementById("userInfo").textContent="Prihlásený: "+(session.username||"Používateľ")+" | Rola: "+(session.role||"user");
 const all=["1.html","2.html","3.html","4.html","5.html","6.html","7.html"];
 const allowed=session.role==="admin"?all:(session.allowed_pages||[]);
 const visible=all.filter(p=>allowed.includes(p));if(session.role==="admin")visible.push("admin.html");
 const menu=document.getElementById("menu");
 if(visible.length){const grid=document.createElement("div");grid.className="buttons";visible.forEach(page=>{const a=document.createElement("a");a.className="nav-btn";a.href=page;a.textContent=page==="admin.html"?"Admin portal":page.replace(".html","");grid.appendChild(a)});menu.appendChild(grid)}
 else{const empty=document.createElement("div");empty.className="empty";empty.textContent="Nemáš pridelený žiadny prístup k stránkam.";menu.appendChild(empty)}
 document.getElementById("logoutBtn").addEventListener("click",()=>{localStorage.removeItem("session_user");location.replace("./index.html")});
})();
</script></body></html>
