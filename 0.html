<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu – Habits</title>
<style>
:root{color-scheme:dark;--card:#0e0e0e;--line:#222;--txt:#f2f2f2;--mut:#8a8a8a}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%;margin:0;background:#000;color:var(--txt)}
body{min-height:100svh;display:flex;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(10px + env(safe-area-inset-bottom,0px));font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.35;overscroll-behavior-y:none}
main{width:100%;max-width:720px;margin:auto}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 10px;min-height:36px}
h1{font-size:1.5rem;margin:0;font-weight:700;letter-spacing:-.02em}
.user{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.meta{font-size:.78rem;color:var(--mut);overflow-wrap:anywhere}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(10px,2.5vh,14px)}
.buttons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.nav-btn{display:flex;align-items:center;justify-content:center;min-height:54px;min-width:0;padding:12px;text-decoration:none;text-align:center;color:var(--txt);background:#111;border:1px solid #242424;border-radius:12px;font-size:.95rem;font-weight:600;transition:background .15s,border-color .15s,transform .15s;overflow-wrap:anywhere}
.nav-btn:hover{background:#191919;border-color:#444}
.nav-btn:active{transform:scale(.985)}
.ghost{background:#161616;color:var(--txt);padding:8px 12px;font-size:.82rem;border:1px solid #262626;border-radius:10px;min-height:36px}
.logout{color:#ff7777;border-color:#4a2424}
.empty{padding:28px 14px;text-align:center;color:var(--mut);font-size:.9rem}
.brandline{display:flex;align-items:center;gap:9px;min-width:0}
.branddot{width:8px;height:8px;border-radius:50%;background:#fff;flex:none}
@media(max-width:600px){.buttons{grid-template-columns:repeat(2,minmax(0,1fr))}.hd{align-items:center}.user{gap:6px}}\n@media(max-height:620px){body{padding-top:6px;padding-bottom:6px}.hd{margin-bottom:7px;min-height:32px}.card{padding:8px}.nav-btn{min-height:44px;padding:8px}}
@media(max-width:380px){body{padding-left:11px;padding-right:11px}.buttons{grid-template-columns:1fr}.nav-btn{min-height:46px}.hd{flex-direction:row;align-items:center}.user{width:auto;justify-content:flex-end}.meta{max-width:42vw;text-align:right}}
</style>
</head>
<body>
<main>
  <header class="hd">
    <div class="brandline"><span class="branddot" aria-hidden="true"></span><h1>Habits</h1></div>
    <div class="user"><span class="meta" id="userInfo"></span><button class="ghost logout" id="logoutBtn" type="button">Odhlásiť</button></div>
  </header>
  <section class="card" aria-label="Hlavné menu"><div id="menu"><div class="empty">Overujem prihlasovaciu reláciu…</div></div></section>
</main>
<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(async function(){
 let session=null;
 try{session=JSON.parse(localStorage.getItem("session_user")||"null")}catch(e){}
 const cfg=window.APP_CONFIG||{};
 if(!session||!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY||!window.supabase){location.replace("./index.html");return}
 const token=session.habits_token||session.token;
 if(!token){localStorage.removeItem("session_user");location.replace("./index.html");return}
 const db=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
 const logoutBtn=document.getElementById("logoutBtn");
 logoutBtn.addEventListener("click",async()=>{
  logoutBtn.disabled=true;
  try{await db.rpc("habits_legacy_logout",{p_token:token})}catch(e){console.warn("Serverové odhlásenie sa nepodarilo:",e)}
  localStorage.removeItem("session_user");
  location.replace("./index.html");
 });
 try{
  const {data,error}=await db.rpc("habits_legacy_validate_session",{p_token:token});
  if(error||!data||data.ok!==true){localStorage.removeItem("session_user");location.replace("./index.html");return}
  session={...session,...data,token:token,habits_token:token};
  localStorage.setItem("session_user",JSON.stringify(session));
  document.getElementById("userInfo").textContent=(session.username||"Používateľ")+" · "+(session.role||"user");
  const all=["1.html","2.html","3.html","4.html","5.html","6.html","7.html"];
  const allowed=session.is_admin?all:(Array.isArray(session.allowed_pages)?session.allowed_pages:[]);
  const visible=all.filter(p=>allowed.includes(p));
  if(session.is_admin)visible.push("admin.html");
  const menu=document.getElementById("menu");
  if(visible.length){
   const grid=document.createElement("div");grid.className="buttons";
   visible.forEach(page=>{
    const a=document.createElement("a");a.className="nav-btn";a.href=page;
    a.textContent=page==="admin.html"?"Admin portal":page.replace(".html","");
    grid.appendChild(a);
   });
   menu.replaceChildren(grid);
  }else{
   const empty=document.createElement("div");empty.className="empty";
   empty.textContent="Nemáš pridelený žiadny prístup k stránkam.";
   menu.replaceChildren(empty);
  }
 }catch(e){
  console.error(e);localStorage.removeItem("session_user");location.replace("./index.html");
 }
})();
</script>
</body>
</html>
