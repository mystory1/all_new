/* Mobile layout: keep all controls in normal document flow.

main{position:relative;isolation:auto;min-height:100vh;min-height:100dvh;padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}
.hd{position:relative;top:auto;z-index:auto;height:auto;min-height:40px;margin:6px 0 14px;padding:0;background:#000;isolation:auto;}

.freq-days label{display:block;min-width:0}
.freq-days input{position:absolute;opacity:0;pointer-events:none}
.freq-days span{display:flex;align-items:center;justify-content:center;min-height:34px;border:1px solid #292929;border-radius:9px;background:#141414;color:var(--mut);font-size:.76rem;font-weight:600}
.freq-days input:checked+span{background:#fff;color:#000;border-color:#fff}
.freq-days input:focus-visible+span{outline:2px solid #fff;outline-offset:2px}
.freq-help{display:none}
.freq-toggle{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:3px;background:#151515;border:1px solid #292929;border-radius:10px}
.freq-toggle button{padding:8px 6px;border-radius:7px;background:transparent;color:var(--mut);font-size:.82rem;font-weight:600}
.freq-toggle button.on{background:#fff;color:#000}
.detail-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin:12px 0 10px}
.detail-tabs button{padding:9px 4px;background:#151515;border:1px solid #252525;color:var(--mut);border-radius:9px;font-size:.78rem;font-weight:600}
.detail-tabs button.on{background:#fff;color:#000;border-color:#fff}
.detail-panel[hidden]{display:none!important}
.detail-panel>.col{gap:10px}
.detail-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:4px 0 10px}
.detail-stat{padding:10px;background:#0a0a0a;border:1px solid #1d1d1d;border-radius:10px}
.detail-stat b{display:block;font-size:1.05rem;color:var(--txt)}
.detail-stat span{font-size:.72rem;color:var(--mut)}
.detail-note{margin-top:10px;padding:10px;background:#0a0a0a;border:1px solid #1d1d1d;border-radius:10px;display:grid;gap:5px;overflow-wrap:anywhere}
.cal .rest-day{opacity:.22;cursor:default;background:#090909}
.cal button.day{
  appearance:none;-webkit-appearance:none;
  position:relative;
  display:flex;align-items:center;justify-content:center;
  width:100%;min-width:0;min-height:0;aspect-ratio:1;
  padding:0;margin:0;border:0;border-radius:8px;
  background:#141414;color:var(--txt);
  font:inherit;font-size:.8rem;line-height:1;
  cursor:pointer;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.cal button.day.on{background:var(--c);color:#000;font-weight:700}
.cal button.day.t{outline:1px solid #666}
.cal button.day.sel{outline:2px solid #fff;outline-offset:1px}
.cal button.day.hn::after{content:"";position:absolute;right:5px;top:5px;width:5px;height:5px;border-radius:50%;background:#fff}
.cal button.day.on.hn::after{background:#000}
.cal button.day:focus-visible{outline:2px solid #fff;outline-offset:2px}

.sq i.r{background:transparent;border:1px dashed #333}
.freq-summary{font-size:.76rem;color:var(--mut)}
.end-date-field{display:grid;gap:5px;min-width:0}.end-date-row{display:flex;align-items:center;gap:7px;min-width:0}
.end-date-row .fld{flex:1;min-width:0}
.end-clear{height:38px;flex:none;padding:0 10px;font-size:.76rem}
.end-clear:disabled{opacity:.35;cursor:default}
.day-note{display:grid;gap:5px;min-width:0}
.day-note textarea{display:block;width:100%;min-width:0;box-sizing:border-box;min-height:58px;resize:vertical;background:#000;color:var(--txt);border:1px solid #2a2a2a;border-radius:10px;padding:9px 11px;font:inherit;font-size:16px;line-height:1.4;outline:none;-webkit-user-select:text;user-select:text;touch-action:pan-y}
.day-note textarea:focus{border-color:#777;outline:1px solid #777}
.dp{touch-action:pan-y}

.orow .nm{flex:1;min-width:0}
.orow .ck{margin-left:auto;flex:none}
.ovsum-copy{flex:1;min-width:0}.ovs .ot{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ovs .meta,.ovs .cm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;min-height:1.2em}
.ovs .cm{line-height:1.2;margin-top:3px}
/* Keep sticky layers opaque and dragged cards out of hit-testing. */
.sw.dragging-order,.w-sw.dragging-order,.wc.dragging-order{pointer-events:none}
.dragging-order{will-change:transform,opacity;transition:opacity .12s ease,outline-color .12s ease}
.drag-ghost{position:fixed!important;left:0!important;top:0!important;z-index:9999!important;pointer-events:none!important;opacity:.96!important;box-shadow:0 18px 42px rgba(0,0,0,.72)!important;border:1px solid #777!important;transition:none!important;will-change:transform;max-height:150px;overflow:hidden}
.order-drag-active{overscroll-behavior:none}
.orow{min-height:42px}
.drop-before,.drop-after{transition:box-shadow .1s ease;}

/* Final mobile alignment fix: center the complete progress block inside each card. */
#v-act .progress-block.aligned,
#v-wl .progress-block.aligned{
  display:block !important;
  width:calc(100% - 76px) !important;
  max-width:calc(100% - 76px) !important;
  min-width:0 !important;
  margin-left:auto !important;
  margin-right:auto !important;
  box-sizing:border-box !important;
}

#v-act .progress-block.aligned > .bar,
#v-wl .progress-block.aligned > .bar{
  display:block;
  width:100%;
  box-sizing:border-box;
}

#v-act .progress-block.aligned > .pl{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  width:100%;
  min-width:0;
  box-sizing:border-box;
}

#v-act .progress-block.aligned > .pl span{min-width:0}

#v-act .progress-block.aligned > .pl span:last-child{
  text-align:right;
  overflow-wrap:anywhere;
}
</style>

    var accountStorageSuffix=String(session.id||'').replace(/[^a-zA-Z0-9_-]/g,'');
    if(!accountStorageSuffix) throw new Error('Nepodarilo sa identifikovať používateľský účet.');
    KEY='aktivity_v1_'+accountStorageSuffix;
    WLK='aktivity_wish_v1_'+accountStorageSuffix;
    CURRENT_USER=session;
    wLoad();
    load();
    var localItems=items.slice();
    var localWishlist=WL.slice();
    var remote=await loadRemoteWorkspace();
    if(!remote.hasRemoteData){
      // Preserve this browser's existing workspace and import it once.
      items=localItems;
      WL=localWishlist;
    }
    DB_READY=true;
    if(!remote.hasRemoteData && (items.length||WL.length)) scheduleRemoteSave();
    window.scrollTo(0,0);
    render();
    setTab("ov");
    requestAnimationFrame(function(){window.scrollTo(0,0)});
  }catch(e){
    console.error(e);
    document.body.innerHTML='<main><div class="card"><h2>Nepodarilo sa načítať aplikáciu</h2><p style="color:#aaa;line-height:1.6">'+esc(e&&e.message?e.message:"Neznáma chyba")+'</p><button class="primary" onclick="location.reload()">Skúsiť znova</button></div></main>';
  }
}
boot();
</script>
</body>
</html>
