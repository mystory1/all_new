/* Mobile layout: keep all controls in normal document flow.
   No fixed overlay or sticky layer may cover category filters on any tab. */
main{position:relative;isolation:auto;min-height:100vh;min-height:100dvh;padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}
.hd{position:relative;top:auto;z-index:auto;height:auto;min-height:40px;margin:6px 0 14px;padding:0;background:#000;isolation:auto;}
.tabs{position:relative;top:auto;z-index:auto;background:#101010;box-shadow:none;isolation:auto;}
#chips,#catp,#v-wl .seg{position:static;box-shadow:none}
html,body{max-width:100%;overflow-x:hidden}
body{overscroll-behavior-y:auto}
#chips{padding:0;margin:0 0 8px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;overflow:visible;}
#chips button{display:inline-flex;align-items:center;justify-content:center;width:100%;min-width:0;height:32px;min-height:32px;margin:0;padding:0 8px;box-sizing:border-box;font-size:.76rem;line-height:1;font-weight:600;white-space:nowrap;border-radius:10px;overflow:hidden;text-overflow:ellipsis;}
#chips button.cm{max-width:none;flex:none;font-size:.76rem;margin:0;padding:0 8px;height:32px;min-height:32px;line-height:1;}
/* Activity category filters intentionally mirror the Overview .seg control.
   Keep dimensions and spacing identical; only the number of columns differs. */
#v-act #chips{
  display:flex;
  flex-wrap:nowrap;
  gap:2px;
  padding:2px;
  margin:0 0 12px;
  min-height:0;
  background:#101010;
  border:1px solid #1d1d1d;
  border-radius:12px;
  box-sizing:border-box;
}
#v-act #chips button,
#v-act #chips button.cm{
  display:flex;
  align-items:center;
  justify-content:center;
  flex:1 1 0;
  width:auto;
  min-width:0;
  max-width:none;
  height:auto;
  min-height:0;
  padding:5px 6px;
  margin:0;
  border:0;
  border-radius:9px;
  background:transparent;
  color:var(--mut);
  font-size:.76rem;
  font-weight:600;
  line-height:1.4;
  white-space:nowrap;

  wlEl.querySelectorAll(".w-sw.open").forEach(function(x){if(x!==wrap)x.classList.remove("open")});
  wSwipe={wrap:wrap,card:wrap.querySelector(".wc"),x:ev.clientX,y:ev.clientY,drag:false,was:wrap.classList.contains("open"),id:ev.pointerId};
});
wlEl.addEventListener("pointermove",function(ev){if(!wSwipe||ev.pointerId!==wSwipe.id)return;var dx=ev.clientX-wSwipe.x,dy=ev.clientY-wSwipe.y;
  if(!wSwipe.drag){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)*1.2){wSwipe.drag=true;wSwipe.card.style.transition="none";try{wSwipe.card.setPointerCapture(wSwipe.id)}catch(e){}}else return}
  var x=(wSwipe.was?-WW:0)+dx;wSwipe.card.style.transform="translateX("+(x<-WW?-WW+(x+WW)*.25:x>0?x*.2:x)+"px)";ev.preventDefault();
},{passive:false});
function endWishlistSwipe(ev){if(!wSwipe||ev&&ev.pointerId!==wSwipe.id)return;var s=wSwipe;wSwipe=null;s.card.style.transition="";if(!s.drag){if(s.was)s.wrap.classList.remove("open");return}var x=parseFloat((s.card.style.transform.match(/-?[0-9.]+/)||[0])[0]);var open=x<-WW*.4;s.wrap.classList.toggle("open",open);s.card.style.removeProperty("transform");supClick=Date.now();}
wlEl.addEventListener("pointerup",endWishlistSwipe);wlEl.addEventListener("pointercancel",endWishlistSwipe);

function validFrequencyDays(days){
  var out=Array.isArray(days)?days.map(Number).filter(function(x,i,v){return Number.isInteger(x)&&x>=1&&x<=7&&v.indexOf(x)===i}).sort():[];
  return out;
}
var DB=null,DB_READY=false,REMOTE_TIMER=null,REMOTE_CHAIN=Promise.resolve(),CURRENT_USER=null;
function dbError(e){console.error("Supabase:",e);toast("Chyba synchronizácie: "+(e&&e.message?e.message:"neznáma chyba"))}
function scheduleRemoteSave(){
  if(!DB_READY)return;
  clearTimeout(REMOTE_TIMER);
  REMOTE_TIMER=setTimeout(function(){
    var snapshot={
      activities:items.map(function(a,i){return{id:String(a.id),sort_order:i,name:a.name,category:a.cat||"",note:a.note||"",color:a.color||COLORS[0],start_date:a.start,end_date:a.end||null,goal_days:a.goal||0,auto_count:a.auto!==false,base_count:a.base||0,ended:!!a.ended,frequency_type:a.frequency||"daily",frequency_days:(a.frequency==="custom"?validFrequencyDays(a.frequencyDays):[1,2,3,4,5,6,7])}}),
      activity_days:[],
      activity_history:[],
      lists:LISTS.map(function(l,i){return{id:String(l.id),sort_order:i,list_type:l.type,title:l.title,created_date:l.created||todayStr()}}),
      list_items:LIST_ITEMS.map(function(it,i){return{id:String(it.id),list_id:String(it.list_id),sort_order:it.sort_order==null?i:it.sort_order,title:it.title,note:it.note||"",amount:it.amount==null?null:it.amount,is_done:!!it.done,created_date:it.created||todayStr(),due_date:it.due||null}})
    };
    items.forEach(function(a){
      var keys={};Object.keys(a.done||{}).forEach(function(k){keys[k]=1});Object.keys(a.notes||{}).forEach(function(k){keys[k]=1});
      Object.keys(keys).forEach(function(day){
        snapshot.activity_days.push({activity_id:String(a.id),day_date:day,is_done:Object.prototype.hasOwnProperty.call(a.done||{},day)?a.done[day]!==false:null,note:(a.notes||{})[day]||null});
      });
      (a.history||[]).forEach(function(h,i){
        snapshot.activity_history.push({id:String(a.id)+":"+i,activity_id:String(a.id),position:i,start_date:h.start||a.start,end_date:h.end||a.start,days_count:h.days||0,completion_pct:h.pct==null?null:h.pct,event_type:h.type||"reset"});
      });
    });
    REMOTE_CHAIN=REMOTE_CHAIN.then(async function(){
      var result=await DB.rpc("habits_legacy_save_workspace",{
        p_token:CURRENT_USER.habits_token,
        p_activities:snapshot.activities,
        p_activity_days:snapshot.activity_days,
        p_activity_history:snapshot.activity_history,
        p_lists:snapshot.lists,
        p_list_items:snapshot.list_items
      });
      if(result.error)throw result.error;
    }).catch(dbError);
  },450);
}
function applySavedOrder(arr,key){
  try{
    var ids=JSON.parse(localStorage.getItem(key)||"[]");
    if(!Array.isArray(ids)||!ids.length)return arr;
    var rank={};ids.forEach(function(id,i){rank[String(id)]=i});
    return arr.slice().sort(function(a,b){
      var ai=rank[String(a.id)],bi=rank[String(b.id)];
      if(ai===undefined&&bi===undefined)return 0;
      if(ai===undefined)return 1;if(bi===undefined)return -1;return ai-bi;
    });
  }catch(e){return arr}
}
function persistSavedOrder(arr,key){
  try{localStorage.setItem(key,JSON.stringify(arr.map(function(x){return String(x.id)})))}catch(e){}
}
async function loadRemoteWorkspace(){
  var result=await DB.rpc("habits_legacy_load_workspace",{p_token:CURRENT_USER.habits_token});
  if(result.error)throw result.error;
  var payload=result.data||{};
  var aRows=payload.activities||[],dRows=payload.activity_days||[],hRows=payload.activity_history||[];
  var listRows=payload.lists||[],listItemRows=payload.list_items||[];
  var byId={};
  items=aRows.map(function(r){
    var a=norm({id:r.id,sort_order:r.sort_order,name:r.name,cat:r.category||"",note:r.note||"",color:r.color||COLORS[0],start:r.start_date,end:r.end_date||null,goal:r.goal_days||0,auto:r.auto_count,base:r.base_count||0,ended:!!r.ended,frequency:r.frequency_type||"daily",frequencyDays:r.frequency_days||[1,2,3,4,5,6,7],done:{},notes:{},history:[]});
    byId[a.id]=a;return a;
  }).sort(function(a,b){return (a.sort_order==null?0:a.sort_order)-(b.sort_order==null?0:b.sort_order)});
  items=applySavedOrder(items,KEY+"_order");
  dRows.forEach(function(r){var a=byId[r.activity_id];if(!a)return;if(r.is_done!==null)a.done[r.day_date]=r.is_done?"":false;if(r.note)a.notes[r.day_date]=r.note});
  hRows.forEach(function(r){var a=byId[r.activity_id];if(a)a.history.push({start:r.start_date,end:r.end_date,days:r.days_count,pct:r.completion_pct,type:r.event_type})});
  LISTS=listRows.map(function(r){return{id:r.id,type:r.list_type,title:r.title,created:r.created_date,sort_order:r.sort_order}}).sort(function(a,b){return (a.sort_order||0)-(b.sort_order||0)});
  LIST_ITEMS=listItemRows.map(function(r){return{id:r.id,list_id:r.list_id,title:r.title,note:r.note||"",amount:r.amount==null?null:Number(r.amount),done:!!r.is_done,created:r.created_date,due:r.due_date||null,sort_order:r.sort_order}});
  listSaveLocalOnly();
  return {hasRemoteData:aRows.length>0||listRows.length>0||listItemRows.length>0||dRows.length>0||hRows.length>0,hasRemoteLists:listRows.length>0||listItemRows.length>0};
}
async function boot(){
  try{
    var session=null;
    try{session=JSON.parse(localStorage.getItem("session_user")||"null")}catch(e){}
    if(!session){location.replace("./index.html");return}
    // The login RPC returns the session token as `token`.
    // The workspace RPC expects the same value under `habits_token`.
    // Normalize the property name and persist it so navigation through 0.html keeps it.
    if(!session.habits_token && session.token){
      session.habits_token=session.token;
      localStorage.setItem("session_user",JSON.stringify(session));
    }
    if(!session.habits_token){
      document.body.innerHTML='<main><div class="card"><h2>Vyžaduje sa nové prihlásenie</h2><p>Odhlás sa a znova prihlás. Potrebujeme vytvoriť bezpečnú reláciu pre synchronizáciu.</p><button class="primary" onclick="localStorage.removeItem(\'session_user\');location.replace(\'./index.html\')">Prejsť na prihlásenie</button></div></main>';return;
    }
    DB=window.supabase.createClient(APP_CONFIG.SUPABASE_URL,APP_CONFIG.SUPABASE_ANON_KEY);
    var auth=await DB.rpc("habits_legacy_validate_session",{p_token:session.habits_token});
    if(auth.error||!auth.data||auth.data.ok!==true){localStorage.removeItem("session_user");location.replace("./index.html");return;}
    session=Object.assign({},session,auth.data,{token:session.habits_token,habits_token:session.habits_token});
    localStorage.setItem("session_user",JSON.stringify(session));
    if(!session.is_admin && !(session.allowed_pages||[]).includes("7.html")){
      document.body.innerHTML='<main><div class="card"><h2>Nemáš prístup</h2><p>Administrátor ti zatiaľ nepovolil túto stránku.</p><p><a href="./0.html" style="color:#fff">Späť do menu</a></p></div></main>';return;
    }
    document.getElementById("accountName").textContent=session.username||"";
    document.getElementById("logoutBtn").addEventListener("click",function(){
      location.replace("./0.html");
    });
    // Browser-local workspace must be isolated per account.
    // Never reuse the old shared keys across different signed-in users.
    var accountStorageSuffix=String(session.id||'').replace(/[^a-zA-Z0-9_-]/g,'');
    if(!accountStorageSuffix) throw new Error('Nepodarilo sa identifikovať používateľský účet.');
    KEY='aktivity_v1_'+accountStorageSuffix;
    WLK='aktivity_lists_v1_'+accountStorageSuffix;
    var oldWishlistKey='aktivity_wish_v1_'+accountStorageSuffix;
    if(!localStorage.getItem(WLK)&&localStorage.getItem(oldWishlistKey)){
      try{
        var legacyWishlist=JSON.parse(localStorage.getItem(oldWishlistKey)||"[]");
        if(Array.isArray(legacyWishlist)&&legacyWishlist.length){
          var legacyListId="legacy-wishlist";
          LISTS=[{id:legacyListId,type:"wishlist",title:"Wishlist",created:todayStr(),sort_order:0}];
          LIST_ITEMS=legacyWishlist.map(function(w,i){return{id:String(w.id||("legacy-"+i)),list_id:legacyListId,title:w.text||"Položka",note:w.note||"",amount:null,done:!!w.done,created:w.created||todayStr(),due:w.due||null,sort_order:i}});
          listSaveLocalOnly();
        }
      }catch(migrationError){console.warn("Lokálna migrácia Wishlist:",migrationError)}
    }
    CURRENT_USER=session;
    listLoad();
    load();
    var localItems=items.slice();
    var localLists=LISTS.slice(),localListItems=LIST_ITEMS.slice();
    var remote=await loadRemoteWorkspace();
    if(!remote.hasRemoteData){
      // Preserve this browser's existing workspace and import it once.
      items=localItems;
      LISTS=localLists;LIST_ITEMS=localListItems;
    }else if(!remote.hasRemoteLists && (localLists.length||localListItems.length)){
      // Existing remote Habits data must not cause local Lists data to be discarded.
      LISTS=localLists;LIST_ITEMS=localListItems;
    }
    DB_READY=true;
    if((!remote.hasRemoteData||(!remote.hasRemoteLists&&(LISTS.length||LIST_ITEMS.length))) && (items.length||LISTS.length||LIST_ITEMS.length)) scheduleRemoteSave();
    window.scrollTo(0,0);
    render();
    setTab("ov");
    requestAnimationFrame(function(){window.scrollTo(0,0)});
  }catch(e){
    console.error(e);
    document.body.innerHTML='<main><div class="card"><h2>Nepodarilo sa načítať aplikáciu</h2><p style="color:#aaa;line-height:1.6">'+esc(e&&e.message?e.message:"Neznáma chyba")+'</p><button class="primary" onclick="location.reload()">Skúsiť znova</button></div></main>';
  }
}
boot();
</script>
