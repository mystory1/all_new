<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habits</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--card:#0e0e0e;--line:#222;--txt:#f2f2f2;--mut:#8a8a8a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:#000;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:720px;margin:0 auto;padding:16px 14px 60px}
.hd{display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px;gap:10px}
h1{font-size:1.5rem;margin:0;font-weight:700;letter-spacing:-.02em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.sw{position:relative;margin-bottom:10px}
.sw .card{position:relative;z-index:1;touch-action:pan-y;transition:transform .35s cubic-bezier(.22,1,.36,1)}
.sw.open,.sw.pd{--p:1}
.del{position:absolute;right:0;top:0;bottom:0;width:76px;display:flex;border-radius:0 16px 16px 0;overflow:hidden;opacity:calc(var(--p,0)*6)}
.del{background:linear-gradient(90deg,#b91c1c,#ef4444)}
.del button{flex:1;display:flex;align-items:center;justify-content:center;background:transparent;color:#fff;border-radius:0;-webkit-tap-highlight-color:transparent}
.del svg{display:block;transform:scale(calc(.6 + .4*var(--p,0)));opacity:calc(.35 + .65*var(--p,0));transition:transform .2s}
.sw.pd .del{width:160px}
.sw.pd .del button{font-size:.95rem;font-weight:600}
.sw.pd .del button+button{background:rgba(0,0,0,.3)}
.sw.pd .card{transform:translateX(-160px)}
form,.col{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media(max-width:480px){.row{grid-template-columns:minmax(0,1fr)}}
label{font-size:.75rem;color:var(--mut);display:grid;grid-template-columns:minmax(0,1fr);gap:5px}
label>*{min-width:0}
.fld{display:block;position:relative;width:100%;max-width:100%;height:38px;background:#000;border:1px solid #2a2a2a;border-radius:10px;overflow:hidden}
.fld:focus-within{border-color:var(--c,#fff)}
.fld input{position:static;display:block;width:100%;height:100%;min-width:0;min-height:0;margin:0;border:0;border-radius:0;background:transparent;color:var(--txt);padding:0 12px;font:inherit;font-size:16px;line-height:normal;-webkit-appearance:none;appearance:none;text-align:left;outline:none}
.fld input[type=date]{display:flex;align-items:center;justify-content:flex-start;text-align:left}
.fld input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
.fld input[type=date]::-webkit-datetime-edit{padding:0}
input:focus{outline:2px solid var(--c,#fff);outline-offset:1px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px}
.primary{background:#fff;color:#000;padding:12px;font-weight:600}
.ghost{background:#161616;color:var(--txt);padding:8px 12px;font-size:.85rem;border:1px solid #262626}
.danger{color:#ff6b6b}
.add{background:#fff;color:#000;padding:9px 14px;font-weight:600;font-size:.9rem}
.dots{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cl{font-size:.75rem;color:var(--mut);margin-bottom:6px}
details.d>.sm{margin-top:16px;line-height:1.7}
.er{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #161616;flex-wrap:wrap}
.er:last-child{border:0}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0;background:var(--c);box-shadow:0 0 0 2px #000 inset}
.dot.on{border-color:#fff}
.tg{display:flex;align-items:center;gap:10px;font-size:.92rem;color:var(--txt);cursor:pointer}
.tg input{width:20px;height:20px;accent-color:#fff;margin:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.name{font-size:1.1rem;font-weight:600;word-break:break-word}
.meta,.cf{font-size:.78rem;color:var(--mut)}
.big{font-size:1.9rem;font-weight:700;line-height:1;color:var(--c);text-align:right;white-space:nowrap}
.big small{font-size:.85rem;font-weight:500;color:var(--mut);margin-left:6px}
.bar{height:8px;background:#1c1c1c;border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .4s}
.pl{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--mut);margin-top:6px}
.go{width:100%;margin-top:12px;padding:13px;background:var(--c);color:#000;font-weight:700;font-size:1rem}
.go:active{opacity:.8}
.ok,.off{margin-top:12px;padding:12px;text-align:center;border:1px solid var(--line);border-radius:12px;color:var(--mut);font-size:.9rem}
summary{list-style:none}
summary::-webkit-details-marker{display:none}
details.d{margin-top:12px}
details.d>summary,details.n>summary{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;color:var(--txt);font-size:.9rem;-webkit-tap-highlight-color:transparent}
details.d>summary{padding:11px 14px;background:#151515;border:1px solid #242424;border-radius:12px;font-weight:600}
details.d[open]>summary{border-color:var(--c,#444)}
details.d>summary::after,details.n>summary::after{content:"›";font-size:1.3rem;line-height:1;color:var(--mut);transition:transform .2s}
details[open]>summary::after{transform:rotate(90deg)}
details.n{margin-top:8px;background:#0a0a0a;border:1px solid #1d1d1d;border-radius:12px;overflow:hidden}
details.n>summary{padding:13px 14px}
details.n>.in{padding:6px 14px 14px;min-width:0;overflow-x:clip}
details.n[open]{border-color:#2c2c2c}
.sec{margin-top:12px}
.sm{font-size:.85rem;color:var(--txt)}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:.8rem;margin-top:8px}
.cal span{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#141414;color:var(--txt);cursor:pointer}
.cal .w{background:none;aspect-ratio:auto;font-size:.68rem;color:var(--mut);cursor:default}
.cal .e{background:none;cursor:default}
.cal .x{opacity:.25;cursor:default}
.cal .on{background:var(--c);color:#000;font-weight:700}
.cal .t{outline:1px solid #666}
.cn{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:.85rem}
.cn button{background:#161616;color:var(--txt);width:38px;height:32px}
.h{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;padding:7px 0;border-bottom:1px solid #161616;flex-wrap:wrap}
.h b{color:var(--c)}
.empty{text-align:center;color:var(--mut);padding:36px 0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#000;padding:11px 18px;border-radius:99px;font-weight:600;font-size:.88rem;opacity:0;pointer-events:none;z-index:9;transition:opacity .25s}
#toast.show{opacity:1}
.chips,.catp{display:flex;flex-wrap:wrap;gap:6px}
.chips{margin:0 0 8px}
.catp{margin:0 0 12px;padding:10px;background:#0e0e0e;border:1px solid #1d1d1d;border-radius:14px}
.chips button,.catp button{background:#141414;color:var(--mut);border:1px solid #242424;padding:7px 10px;font-size:.8rem;border-radius:99px}
.chips button.on,.catp button.on{background:#fff;color:#000;border-color:#fff;font-weight:600}
.dp{margin-top:12px;padding-top:12px;border-top:1px solid #1d1d1d;display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.dp .ghost.on{border-color:var(--c);color:var(--c)}
.cal span{position:relative}
.cal .hn::after{content:"";position:absolute;right:5px;top:5px;width:5px;height:5px;border-radius:50%;background:#fff}
.cal .on.hn::after{background:#000}
.cal .sel{outline:2px solid #fff;outline-offset:1px}
.card.flash{animation:glow .9s ease-out}
.card.flash .big{animation:pop2 .6s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 0 var(--c)}25%{box-shadow:0 0 28px 3px var(--c);background:color-mix(in srgb,var(--c) 20%,#0e0e0e);border-color:var(--c)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes pop2{0%{transform:scale(1)}35%{transform:scale(1.3)}100%{transform:scale(1)}}
.sw details.d>summary{display:none}
.sw details.d{margin-top:0}
.sw details.d[open]{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.sw details.d>.sm{margin-top:0}
.sw .card{cursor:pointer;-webkit-tap-highlight-color:transparent}
.top{align-items:center;gap:12px}
.chips button{white-space:nowrap}
.chips button.cm{max-width:60%;overflow:hidden;text-overflow:ellipsis}
.ck{flex:none;width:36px;height:36px;border-radius:11px;background:#111;border:1.5px solid #2c2c2c;display:grid;place-items:center;padding:0;transition:transform .15s,box-shadow .3s,background .25s,border-color .25s;-webkit-tap-highlight-color:transparent}
.ck svg{width:20px;height:20px;fill:none;stroke:#444;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;transition:stroke .25s}
button.ck:not(:disabled):active{transform:scale(.88)}
.ck.on{background:var(--c);border-color:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 45%,transparent)}
.ck.on svg{stroke:#000;animation:draw .35s ease-out}
.ck:disabled{opacity:.35;cursor:default}
@keyframes draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
.add{width:40px;height:40px;padding:0;border-radius:12px;font-size:1.5rem;line-height:1;display:grid;place-items:center;font-weight:500}
html{background:#000}
html,body{overscroll-behavior:none;min-height:100%;background:#000}
button,.cal span,.hm span{touch-action:manipulation}
.tabs,.seg{display:flex;background:#101010;border:1px solid #1d1d1d;border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.tabs button,.seg button{flex:1;background:none;color:var(--mut);padding:9px 6px;font-size:.88rem;border-radius:9px;font-weight:600}
.tabs button.on,.seg button.on{background:#fff;color:#000}
.seg button{padding:7px 6px;font-size:.82rem}
.onav{display:flex;justify-content:space-between;align-items:center;margin:2px 0 12px}
.onav b{font-size:.95rem}
.onav button{width:40px;height:34px;background:#141414;color:var(--txt);border:1px solid #242424}
.onav button:disabled{opacity:.3}
.ovs{display:flex;align-items:center;gap:16px;margin-bottom:10px}
.ot{font-size:1.2rem;font-weight:700;line-height:1.25}
.sh{font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:4px}
.orow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #161616}
.orow:last-child,.arow:last-child,.am:last-child{border:0}
.orow .nm{min-width:0;font-size:.95rem;word-break:break-word}
.orow small{display:block;color:var(--mut);font-size:.74rem}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:6px}
.bc{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.7rem;color:var(--mut)}
.bt{height:78px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bb{width:70%;max-width:26px;min-height:3px;border-radius:6px 6px 3px 3px;background:#22c55e}
.bb.z{background:#1c1c1c}
.arow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #161616;font-size:.9rem}
.arow .nm{flex:1;min-width:0;word-break:break-word}
.sq{display:flex;gap:4px}
.sq i{width:13px;height:13px;border-radius:4px;background:#1c1c1c}
.sq i.on{background:var(--c)}
.sq i.x{background:none;border:1px dashed #262626}
.arow b{color:var(--c);min-width:34px;text-align:right}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.hm span{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:.75rem;background:#141414;color:var(--mut)}
.hm .w{background:none;aspect-ratio:auto;font-size:.68rem}
.am{padding:9px 0;border-bottom:1px solid #161616}
.am .t2{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;margin-bottom:6px}
.am .t2 b{color:var(--c)}
.am .bar{margin-top:0}
.rg{flex:none}
#v-ov .card{margin-bottom:12px}
#v-ov .seg{margin-bottom:14px}
body{overflow-anchor:none}
.hd{height:40px}
.st{display:flex;align-items:center;gap:10px}
.ic{width:19px;height:19px;fill:none;stroke:var(--c,#fff);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.seg{padding:2px;gap:2px}
.seg button{padding:5px 6px;font-size:.76rem}
.chips button,.catp button{border-radius:10px;padding:6px 10px;font-size:.76rem}
.chips{margin:0 0 10px}
#v-ov .card{margin-bottom:10px}
#v-ov .seg{margin-bottom:10px}
.fld.bad{border-color:#ef4444;background:rgba(239,68,68,.07)}
.fe{color:#ff6b6b;font-size:.76rem;line-height:1.3}
.bars.y{grid-template-columns:repeat(12,1fr);gap:3px}
.bars.y .bb{width:100%;max-width:none}
.bars.y .bc{font-size:.58rem}
.ib{width:38px;height:34px;display:grid;place-items:center;padding:0;background:#141414;border:1px solid #242424;color:var(--mut)}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ib.yes.on{background:var(--c);color:#000;border-color:var(--c)}
.ib.no.on{color:#ff6b6b;border-color:#7f1d1d;background:#1c0d0d}
.chips{min-height:30px}
.sq.l span{width:13px;text-align:center;font-size:.62rem;color:var(--mut)}
.arow.hl{padding:0 0 2px;border:0}
.cm{font-size:.78rem;margin-top:3px;font-weight:600;color:var(--mut)}
.cm.up{color:#22c55e}.cm.dn{color:#ef4444}
.wc{cursor:pointer;-webkit-tap-highlight-color:transparent}
.wc details.d>summary{display:none}
.wc details.d{margin-top:0}
.wc details.d[open]{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
#v-wl .seg{margin-bottom:10px}
</style>
</head>
<body>
<main>
<div class="hd"><h1>Habits</h1><div class="r"><span id="accountName" class="meta"></span><button class="ghost" id="logoutBtn" type="button">Odhlásiť</button><button class="add" id="addb" aria-label="Nová aktivita" style="visibility:hidden">＋</button></div></div>
<div class="tabs"><button data-t="ov" class="on">Prehľad</button><button data-t="act">Aktivity</button><button data-t="wl">Wishlist</button></div>
<div id="v-ov"></div>
<div id="v-act" hidden>
<div class="card" id="add" hidden style="margin-bottom:12px">
<form id="f" novalidate>
<label>Názov aktivity<span class="fld"><input type="text" id="n" maxlength="60" placeholder="napr. Bez cukru"></span></label>
<label>Kategória (nepovinné)<span class="fld"><input type="text" id="cat" maxlength="24" list="cats" placeholder="napr. Zdravie"></span></label>
<datalist id="cats"></datalist>
<div class="row">
<label>Kedy som začal<span class="fld"><input type="date" id="s"></span></label>
<label>Do kedy (nepovinné)<span class="fld"><input type="date" id="e"></span></label>
</div>
<label>Počet dní trvania (nepovinné, bez ohľadu na dátum)<span class="fld"><input type="number" id="g" min="1" max="3650" inputmode="numeric" placeholder="napr. 30"></span></label>
<label class="tg"><input type="checkbox" id="au"> Počítať dni automaticky</label>
<div class="dots" id="pick"></div>
<button class="primary" type="submit">Pridať aktivitu</button>
</form>
</div>
<div class="chips" id="chips" hidden></div>
<div class="catp" id="catp" hidden></div>
<div id="list"></div>
</div>
<div id="v-wl" hidden>
<div class="card" id="wadd" hidden style="margin-bottom:12px">
<form id="wf" novalidate>
<label>Čo si prajem<span class="fld"><input type="text" id="wt" maxlength="80" placeholder="napr. Nové slúchadlá"></span></label>
<label>Do kedy (nepovinné)<span class="fld"><input type="date" id="wdt"></span></label>
<button class="primary" type="submit">Pridať do wishlistu</button>
</form>
</div>
<div id="wlist"></div>
</div>
</main>
<div id="toast"></div>
<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var COLORS=["#3b82f6","#22c55e","#f59e0b","#ef4444","#a855f7","#22d3ee","#f472b6"],KEY="aktivity_v1";
var TRASH='<button data-a="trash" aria-label="Odstrániť"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5.2A1.2 1.2 0 0 1 10.2 4h3.6A1.2 1.2 0 0 1 15 5.2V7"/><path d="M6.2 7l.8 11.2A2 2 0 0 0 9 20h6a2 2 0 0 0 2-1.8L17.8 7"/><path d="M10 11v5M14 11v5"/></svg></button>';
var catOpen=false,flash=null,sel={},S={cat:""},forced=[],items=[],openIds={},mon={},pend=null,pickC=COLORS[0];
var MN=["Január","Február","Marec","Apríl","Máj","Jún","Júl","August","September","Október","November","December"];
function unr(list,map,val){list.forEach(function(r){var p=String(r).split(".."),d=p[0],e=p[1]||p[0],g=0;while(d<=e&&g++<40000){map[d]=val;d=addDays(d,1)}})}
function rng(arr){var out=[],a=null,p=null;arr.forEach(function(d){if(a===null){a=p=d}else if(addDays(p,1)===d){p=d}else{out.push(a===p?a:a+".."+p);a=p=d}});if(a!==null)out.push(a===p?a:a+".."+p);return out}
function pack(map){var T=[],F=[];Object.keys(map).sort().forEach(function(k){(map[k]===false?F:T).push(k)});return{t:rng(T),f:rng(F)}}
function norm(a){var d=a.done;
if(Array.isArray(d)){var o={};d.forEach(function(x){o[x]=""});a.done=o}
else if(d&&Array.isArray(d.t)&&Array.isArray(d.f)){var m={};unr(d.t,m,"");unr(d.f,m,false);a.done=m}
if(!a.done||typeof a.done!=="object")a.done={};if(!a.notes||typeof a.notes!=="object")a.notes={};
if(!Array.isArray(a.history))a.history=[];a.cat=a.cat||"";a.base=Math.max(0,parseInt(a.base,10)||0);return a}
function load(){try{var r=localStorage.getItem(KEY);items=r?JSON.parse(r):[]}catch(x){items=[]}
if(!Array.isArray(items))items=[];items=items.filter(function(a){return a&&a.id&&a.name&&a.start}).map(norm)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items.map(function(a){var c={};for(var k in a)c[k]=a[k];c.done=pack(a.done);return c}))) }catch(x){}scheduleRemoteSave()}
function pad(n){return String(n).padStart(2,"0")}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function pd(s){var a=s.split("-").map(Number);return Date.UTC(a[0],a[1]-1,a[2])}
function addDays(s,n){var d=new Date(pd(s)+n*864e5);return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate())}
function diff(a,b){return Math.round((pd(b)-pd(a))/864e5)}
function fmt(s){var a=s.split("-");return a[2]+"."+a[1]+"."+a[0]}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function dni(n){return n===1?"deň":(n>=2&&n<=4?"dni":"dní")}
function isDone(a,d,now){var v=a.done[d];if(v===false)return false;if(v!==undefined)return true;return a.auto!==false&&d>=a.start&&d<now}
function conf(a,now){var au=a.auto!==false,n=au?Math.max(0,diff(a.start,now)):0;
for(var k in a.done){if(k<a.start||k>now)continue;var f=a.done[k]===false;if(au){if(k<now){if(f)n--}else if(!f)n++}else if(!f)n++}return n}
function cnt(a,now){return conf(a,now)+a.base}

    items.forEach(function(a){
      var keys={};Object.keys(a.done||{}).forEach(function(k){keys[k]=1});Object.keys(a.notes||{}).forEach(function(k){keys[k]=1});
      Object.keys(keys).forEach(function(day){
        snapshot.activity_days.push({activity_id:String(a.id),day_date:day,is_done:Object.prototype.hasOwnProperty.call(a.done||{},day)?a.done[day]!==false:null,note:(a.notes||{})[day]||null});
      });
      (a.history||[]).forEach(function(h,i){
        snapshot.activity_history.push({id:String(a.id)+":"+i,activity_id:String(a.id),position:i,start_date:h.start||a.start,end_date:h.end||a.start,days_count:h.days||0,completion_pct:h.pct==null?null:h.pct,event_type:h.type||"reset"});
      });
    });
    REMOTE_CHAIN=REMOTE_CHAIN.then(async function(){
      var result=await DB.rpc("habits_legacy_save_workspace",{
        p_token:CURRENT_USER.habits_token,
        p_activities:snapshot.activities,
        p_activity_days:snapshot.activity_days,
        p_activity_history:snapshot.activity_history,
        p_wishlist_items:snapshot.wishlist_items
      });
      if(result.error)throw result.error;
    }).catch(dbError);
  },450);
}
async function loadRemoteWorkspace(){
  var result=await DB.rpc("habits_legacy_load_workspace",{p_token:CURRENT_USER.habits_token});
  if(result.error)throw result.error;
  var payload=result.data||{};
  var aRows=payload.activities||[],dRows=payload.activity_days||[],hRows=payload.activity_history||[],wRows=payload.wishlist_items||[];
  var byId={};
  items=aRows.map(function(r){
    var a=norm({id:r.id,name:r.name,cat:r.category||"",color:r.color||COLORS[0],start:r.start_date,end:r.end_date||null,goal:r.goal_days||0,auto:r.auto_count,base:r.base_count||0,ended:!!r.ended,done:{},notes:{},history:[]});
    byId[a.id]=a;return a;
  });
  dRows.forEach(function(r){var a=byId[r.activity_id];if(!a)return;if(r.is_done!==null)a.done[r.day_date]=r.is_done?"":false;if(r.note)a.notes[r.day_date]=r.note});
  hRows.forEach(function(r){var a=byId[r.activity_id];if(a)a.history.push({start:r.start_date,end:r.end_date,days:r.days_count,pct:r.completion_pct,type:r.event_type})});
  WL=wRows.map(function(r){return{id:r.id,text:r.text,due:r.due_date||null,created:r.created_date,done:r.completed_date||null}});
  return {hasRemoteData:aRows.length>0||wRows.length>0||dRows.length>0||hRows.length>0};
}
async function boot(){
  try{
    var session=null;
    try{session=JSON.parse(localStorage.getItem("session_user")||"null")}catch(e){}
    if(!session){location.replace("./index.html");return}
    // The login RPC returns the session token as `token`.
    // The workspace RPC expects the same value under `habits_token`.
    // Normalize the property name and persist it so navigation through 0.html keeps it.
    if(!session.habits_token && session.token){
      session.habits_token=session.token;
      localStorage.setItem("session_user",JSON.stringify(session));
    }
    if(!session.habits_token){
      document.body.innerHTML='<main><div class="card"><h2>Vyžaduje sa nové prihlásenie</h2><p>Odhlás sa a znova prihlás. Potrebujeme vytvoriť bezpečnú reláciu pre synchronizáciu.</p><button class="primary" onclick="localStorage.removeItem(\'session_user\');location.replace(\'./index.html\')">Prejsť na prihlásenie</button></div></main>';return;
    }
    DB=window.supabase.createClient(APP_CONFIG.SUPABASE_URL,APP_CONFIG.SUPABASE_ANON_KEY);
    var auth=await DB.rpc("habits_legacy_validate_session",{p_token:session.habits_token});
    if(auth.error||!auth.data||auth.data.ok!==true){localStorage.removeItem("session_user");location.replace("./index.html");return;}
    session=Object.assign({},session,auth.data,{token:session.habits_token,habits_token:session.habits_token});
    localStorage.setItem("session_user",JSON.stringify(session));
    if(!session.is_admin && !(session.allowed_pages||[]).includes("7.html")){
      document.body.innerHTML='<main><div class="card"><h2>Nemáš prístup</h2><p>Administrátor ti zatiaľ nepovolil túto stránku.</p><p><a href="./0.html" style="color:#fff">Späť do menu</a></p></div></main>';return;
    }
    document.getElementById("accountName").textContent=session.username||"";
    document.getElementById("logoutBtn").addEventListener("click",async function(){
      try{await DB.rpc("habits_legacy_logout",{p_token:session.habits_token});}catch(e){console.warn(e);}
      localStorage.removeItem("session_user");
      location.replace("./index.html");
    });
    CURRENT_USER=session;
    wLoad();
    load();
    var localItems=items.slice();
    var localWishlist=WL.slice();
    var remote=await loadRemoteWorkspace();
    if(!remote.hasRemoteData){
      // Preserve this browser's existing workspace and import it once.
      items=localItems;
      WL=localWishlist;
    }
    DB_READY=true;
    if(!remote.hasRemoteData && (items.length||WL.length)) scheduleRemoteSave();
    render();
    setTab("ov");
  }catch(e){
    console.error(e);
    document.body.innerHTML='<main><div class="card"><h2>Nepodarilo sa načítať aplikáciu</h2><p style="color:#aaa;line-height:1.6">'+esc(e&&e.message?e.message:"Neznáma chyba")+'</p><button class="primary" onclick="location.reload()">Skúsiť znova</button></div></main>';
  }
}
boot();
</script>
