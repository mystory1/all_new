<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habits</title>
<style>
:root{color-scheme:dark;--card:#0e0e0e;--line:#222;--txt:#f2f2f2;--mut:#8a8a8a;--input:#000}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{width:100%;height:100%;min-height:0;margin:0;background:#000;color:var(--txt)}
body{height:100vh;height:100svh;display:flex;justify-content:center;align-items:flex-start;overflow:hidden;padding:calc(20px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.35;overscroll-behavior:none}
.wrap{width:100%;max-width:420px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 18px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.tabs{display:flex;background:#101010;border:1px solid #1d1d1d;border-radius:12px;padding:3px;gap:3px;margin-bottom:17px}
.tab{flex:1;min-width:0;background:none;color:var(--mut);padding:11px 7px;font:inherit;font-size:.9rem;border:0;border-radius:9px;font-weight:600;cursor:pointer}
.tab.active{background:#fff;color:#000}
.panel{display:none}.panel.active{display:block}
form{display:grid;grid-template-columns:minmax(0,1fr);gap:13px}
.field{display:grid;gap:6px;min-width:0}
label{font-size:.78rem;color:var(--mut)}
.fld{display:block;position:relative;width:100%;height:44px;background:var(--input);border:1px solid #2a2a2a;border-radius:10px;overflow:hidden}
.fld:focus-within{border-color:#fff}
.fld input{display:block;width:100%;height:100%;min-width:0;margin:0;border:0;border-radius:0;background:transparent;color:var(--txt);padding:0 13px;font:inherit;font-size:16px;outline:none}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.submit{width:100%;min-height:45px;margin-top:3px;background:#fff;color:#000;padding:10px 14px;border:1px solid #fff;border-radius:11px;font-weight:700;font-size:.95rem}
.submit:disabled{opacity:.55;cursor:wait}
.msg{margin-top:12px;min-height:18px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.84rem;color:var(--mut);line-height:1.45;text-align:center}
.msg.error{color:#ff7777}
@media(max-width:600px){body{padding-left:10px;padding-right:10px}.card{padding:18px 15px}.tabs{margin-bottom:15px}.tab{font-size:.86rem;padding:10px 6px}form{gap:12px}.fld{height:43px}.msg{margin-top:10px}}
@media(max-height:600px){body{align-items:flex-start;overflow:auto}.card{padding-top:12px;padding-bottom:12px}.tabs{margin-bottom:10px}form{gap:8px}.field{gap:4px}.fld{height:38px}.submit{min-height:40px;margin-top:1px;padding:8px 12px}.msg{margin-top:7px;min-height:14px}}
@media(max-width:360px){.card{padding:15px 12px}.tab{font-size:.82rem;padding:9px 5px}.fld{height:41px}}
@media(prefers-reduced-motion:no-preference){.card{animation:appear .28s ease-out}@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}}
</style>
</head>
<body>
<main class="wrap">
<section class="card" aria-label="Prihlásenie a registrácia">
<div class="tabs" role="tablist" aria-label="Typ účtu">
<button class="tab active" id="loginTab" type="button" role="tab" aria-selected="true">Prihlásenie</button>
<button class="tab" id="signupTab" type="button" role="tab" aria-selected="false">Registrácia</button>
</div>
<section class="panel active" id="loginPanel" role="tabpanel">
<form id="loginForm" novalidate>
<label class="field">Meno<span class="fld"><input id="loginUsername" autocomplete="username" placeholder="Zadaj meno" autocapitalize="none"></span></label>
<label class="field">Heslo<span class="fld"><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Zadaj heslo"></span></label>
<button class="submit" id="loginBtn" type="submit">Prihlásiť sa</button>
</form>
</section>
<section class="panel" id="signupPanel" role="tabpanel">
<form id="signupForm" novalidate>
<label class="field">Meno<span class="fld"><input id="signupUsername" autocomplete="username" placeholder="Zadaj meno" autocapitalize="none"></span></label>
<label class="field">Heslo<span class="fld"><input id="signupPassword" type="password" autocomplete="new-password" placeholder="Zadaj heslo"></span></label>
<button class="submit" id="signupBtn" type="submit">Registrovať</button>
</form>
</section>
<div class="msg" id="msg" role="status" aria-live="polite"></div>
</section>
</main>
<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
window.addEventListener("load",()=>{
 const cfg=window.APP_CONFIG||{};
 const msg=document.getElementById("msg");
 const loginTab=document.getElementById("loginTab"),signupTab=document.getElementById("signupTab");
 const loginPanel=document.getElementById("loginPanel"),signupPanel=document.getElementById("signupPanel");
 const loginUsername=document.getElementById("loginUsername"),loginPassword=document.getElementById("loginPassword");
 const signupUsername=document.getElementById("signupUsername"),signupPassword=document.getElementById("signupPassword");
 if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY||!window.supabase){msg.textContent="Aplikáciu sa nepodarilo pripojiť k databáze.";msg.classList.add("error");return}
 const db=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
 function setMode(mode){
  const login=mode==="login";
  loginTab.classList.toggle("active",login);signupTab.classList.toggle("active",!login);
  loginTab.setAttribute("aria-selected",String(login));signupTab.setAttribute("aria-selected",String(!login));
  loginPanel.classList.toggle("active",login);signupPanel.classList.toggle("active",!login);
  msg.textContent="";msg.classList.remove("error");
 }
 function showError(e){msg.textContent="ERR "+(e&&e.message?e.message:String(e));msg.classList.add("error")}
 loginTab.addEventListener("click",()=>setMode("login"));
 signupTab.addEventListener("click",()=>setMode("signup"));
 async function doSignup(){
  const btn=document.getElementById("signupBtn");
  try{
   const u=signupUsername.value.trim(),p=signupPassword.value;
   if(!u||!p){msg.textContent="Vyplň meno a heslo.";return}
   btn.disabled=true;msg.classList.remove("error");msg.textContent="Registrujem…";
   const {data,error}=await db.rpc("habits_legacy_signup",{p_username:u,p_password:p});
   if(error)throw error;
   if(!data||data.ok!==true)throw new Error(data&&data.message?data.message:"Registrácia sa nepodarila.");
   msg.textContent="Registrácia úspešná. Počkaj na schválenie adminom.";
   signupPassword.value="";
  }catch(e){showError(e)}finally{btn.disabled=false}
 }
 async function doLogin(){
  const btn=document.getElementById("loginBtn");
  try{
   const u=loginUsername.value.trim(),p=loginPassword.value;
   if(!u||!p){msg.textContent="Vyplň meno a heslo.";return}
   btn.disabled=true;msg.classList.remove("error");msg.textContent="Prihlasujem…";
   const {data:session,error}=await db.rpc("habits_legacy_login",{p_username:u,p_password:p});
   if(error)throw error;
   if(!session||!session.token)throw new Error("Nepodarilo sa vytvoriť prihlasovaciu reláciu.");
   localStorage.setItem("session_user",JSON.stringify(session));
   msg.textContent="Prihlásenie úspešné.";
   location.assign("./0.html");
  }catch(e){showError(e)}finally{btn.disabled=false}
 }
 document.getElementById("loginForm").addEventListener("submit",e=>{e.preventDefault();doLogin()});
 document.getElementById("signupForm").addEventListener("submit",e=>{e.preventDefault();doSignup()});
});
</script>
</body>
</html>
